name: Images into cache through make

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  BUILDKIT_PROGRESS: plain

jobs:
  test:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    env:
      CACHE_DIR: .buildx-cache
      ENABLE_GHA_CACHE_SAVE: "true"
      ENABLE_GHA_BACKEND: "true"
      ENABLE_LOCAL_CACHE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache scope
        id: cache-scope
        uses: ./.github/actions/set-docker-cache-scope

      - name: Restore buildx cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: buildx-${{ runner.os }}-${{ steps.cache-scope.outputs.cache_scope }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ steps.cache-scope.outputs.cache_scope }}-
            buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests in Docker
        run: make test-docker

  build:
    needs: test
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    env:
      CACHE_DIR: .buildx-cache
      ENABLE_GHA_CACHE_SAVE: "true"
      ENABLE_GHA_BACKEND: "true"
      ENABLE_LOCAL_CACHE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache scope
        id: cache-scope
        uses: ./.github/actions/set-docker-cache-scope

      - name: Restore buildx cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: buildx-${{ runner.os }}-${{ steps.cache-scope.outputs.cache_scope }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ steps.cache-scope.outputs.cache_scope }}-
            buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub runtime for BuildKit GHA cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build (populate cache) via Makefile
        run: |
          make build

  run:
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      CACHE_DIR: .buildx-cache
      ENABLE_GHA_CACHE_SAVE: "false"
      ENABLE_GHA_BACKEND: "true"
      ENABLE_LOCAL_CACHE: "true"
    strategy:
      fail-fast: false
      matrix:
        phrase:
          - "Hello world from job one"
          - "Parallel cows say moo"
          - "Cache makes this fast"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache scope
        id: cache-scope
        uses: ./.github/actions/set-docker-cache-scope

      - name: Restore buildx cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: buildx-${{ runner.os }}-${{ steps.cache-scope.outputs.cache_scope }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ steps.cache-scope.outputs.cache_scope }}-
            buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub runtime for BuildKit GHA cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build (restore cache) via Makefile
        run: make build

      - name: Run via Makefile
        env:
          ARGS: ${{ matrix.phrase }}
        run: make run
